name: Supabase Keep Alive Robot

on:
  schedule:
    # Berjalan setiap 3 hari sekali pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database PostgreSQL via RPC
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/resolve_user_email" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"identifier": "keepalive-ping"}')

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.txt

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Gagal ping Supabase!"
            exit 1
          fi